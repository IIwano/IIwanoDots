source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = false
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
}

# Hora, grande, pegada a la esquina inferior izquierda
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $foreground
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 80, 220
    halign = left
    valign = bottom
}

# Fecha, justo debajo, en mayúsculas con espaciado
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A %d %B" | tr '[:lower:]' '[:upper:]' | sed 's/./&  /g')"
    color = $foreground
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 82, 190
    halign = left
    valign = bottom
}

# Línea fina divisoria
shape {
    monitor =
    size = 260, 1
    color = $primary
    rounding = 0
    position = 80, 165
    halign = left
    valign = bottom
}

# Etiqueta pequeña tipo HUD
label {
    monitor =
    text = A U T H E N T I C A T I O N   R E Q U I R E D
    color = $primary
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 82, 140
    halign = left
    valign = bottom
}

# Campo de contraseña, alineado a la misma columna, sin caja
input-field {
    monitor =
    size = 260, 45
    outline_thickness = 1
    outer_color = $primary
    inner_color = rgba(0, 0, 0, 0)
    font_color = $foreground
    check_color = $primary
    fail_color = rgb(220, 50, 50)
    fail_text = Contraseña incorrecta
    fail_transition = 200
    dots_size = 0.25
    dots_spacing = 0.3
    dots_rounding = 0
    dots_center = false
    placeholder_text = Contraseña
    fade_on_empty = false
    hide_input = false
    rounding = 0
    shadow_passes = 2
    shadow_size = 4
    position = 80, 80
    halign = left
    valign = bottom
}

# Coordenadas tipo HUD, esquina superior derecha
label {
    monitor =
    text = cmd[update:0] echo "$(hostname | tr '[:lower:]' '[:upper:]')"
    color = $foreground
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -80, -60
    halign = right
    valign = top
}

shape {
    monitor =
    size = 180, 1
    color = $primary
    rounding = 0
    position = -80, -95
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:30000] echo "UPTIME  $(uptime -p | sed 's/up //')"
    color = $primary
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = -80, -120
    halign = right
    valign = top
}
