source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = false
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $foreground
    font_size = 60
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%d/%m/%Y")"
    color = $foreground
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 50
    outline_thickness = 1
    outer_color = $primary
    inner_color = rgba(0, 0, 0, 0)
    font_color = $foreground
    check_color = $primary
    fail_color = rgb(220, 50, 50)
    fail_text = Contraseña incorrecta
    fail_transition = 200
    dots_size = 0.3
    dots_spacing = 0.3
    dots_rounding = 0
    dots_center = true
    fade_on_empty = false
    hide_input = false
    rounding = 1
    shadow_passes = 2
    shadow_size = 4
    position = 0, -20
    halign = center
    valign = center
}
